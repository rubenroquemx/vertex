<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>VERTEX</title>
  <meta name="description" content="Sistema multinivel de administración de estructura territorial electoral">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VERTEX">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <div class="boot" id="boot" role="status" aria-live="polite">
    <img src="/brand/logo-claro.svg" alt="VERTEX" class="boot__logo" width="180" height="41">
    <span class="spinner" aria-hidden="true"></span>
    <p class="boot__msg" id="bootMsg">Cargando…</p>
  </div>
  <div class="login" id="login" hidden></div>
  <div class="layout" hidden>
    <div class="main">
      <div class="god-banner" id="godBanner" role="status" hidden></div>
      <header class="topbar">
        <a class="topbar__brand" href="/" data-link aria-label="VERTEX, ir al panel">
          <img src="/brand/icono.svg" alt="" class="topbar__mark" width="32" height="32">
        </a>
        <h1 class="topbar__title" id="pageTitle">Panel</h1>
        <div class="countdown" id="countdown" role="timer" aria-live="off"></div>
        <span class="status" id="netStatus" data-online="true" role="status">En línea</span>
        <label class="dev-switch" id="devSwitch" hidden>
          <span class="sr-only">Ver como (desarrollo)</span>
          <select id="devUser" title="Ver como (desarrollo)"></select>
        </label>
        <button class="icon-btn" id="installBtn" type="button" title="Instalar aplicación" aria-label="Instalar aplicación" hidden></button>
        <a class="user" href="/perfil" data-link id="userLink" title="Mi perfil">
          <span class="user__avatar" id="userAvatar" aria-hidden="true"></span>
          <span class="sr-only">Mi perfil</span>
        </a>
        <button class="icon-btn logout" type="button" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
      <footer class="app-footer">Creado por <a href="https://www.instagram.com/rubenroqueguzman/" target="_blank" rel="noopener noreferrer">Rubén Roque</a></footer>
    </div>

    <nav class="dock" id="nav" aria-label="Navegación principal"></nav>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/app.js" type="module"></script>
</body>
</html>
