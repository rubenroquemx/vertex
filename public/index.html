<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>VERTEX</title>
  <meta name="description" content="Sistema multinivel de administración de estructura territorial electoral">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VERTEX">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <div class="boot" id="boot" role="status" aria-live="polite">
    <img src="/brand/logo-claro.svg" alt="VERTEX" class="boot__logo" width="180" height="41">
    <span class="spinner" aria-hidden="true"></span>
    <p class="boot__msg" id="bootMsg">Cargando…</p>
  </div>
  <div class="login" id="login" hidden></div>
  <div class="layout" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="sidebar__brand">
        <a href="/" data-link aria-label="VERTEX, ir al panel">
          <img src="/brand/logo-oscuro.svg" alt="VERTEX" class="sidebar__logo" width="216" height="49">
          <img src="/brand/icono.svg" alt="" class="sidebar__mark" width="40" height="40">
        </a>
        <div class="countdown" id="countdown" role="timer" aria-live="off"></div>
      </div>

      <nav class="sidebar__nav" id="nav"></nav>

      <div class="sidebar__footer">
        <label class="dev-switch" id="devSwitch" hidden>
          <span>Ver como (desarrollo)</span>
          <select id="devUser"></select>
        </label>
        <button class="btn btn--ghost" id="installBtn" hidden>Instalar aplicación</button>
        <a class="user" href="/perfil" data-link title="Mi perfil">
          <span class="user__avatar" id="userAvatar" aria-hidden="true"></span>
          <span class="user__info">
            <span class="user__name" id="userName"></span>
            <span class="user__role" id="userRole"></span>
          </span>
          <span class="sr-only">Mi perfil</span>
        </a>
        <button class="btn btn--ghost logout" type="button" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </div>
    </aside>

    <div class="backdrop" id="backdrop" hidden></div>

    <div class="main">
      <div class="god-banner" id="godBanner" role="status" hidden></div>
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Contraer menú" aria-controls="sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <img src="/brand/icono.svg" alt="" class="topbar__mark" width="28" height="28">
        <h1 class="topbar__title" id="pageTitle">Panel</h1>
        <span class="status" id="netStatus" data-online="true" role="status">En línea</span>
        <!-- Solo en celulares (sin barra lateral) -->
        <span class="countdown-mini" id="countdownMini"></span>
        <a class="topbar__user" href="/perfil" data-link id="topUser" title="Mi perfil">
          <span class="user__avatar" id="topUserAvatar" aria-hidden="true"></span>
          <span class="sr-only">Mi perfil</span>
        </a>
        <button class="icon-btn topbar__logout" type="button" id="topLogout" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
      <footer class="app-footer">Creado por <a href="https://www.instagram.com/rubenroqueguzman/" target="_blank" rel="noopener noreferrer">Rubén Roque</a></footer>
    </div>

    <!-- Celulares: barra fija inferior solo con los íconos de las funciones -->
    <nav class="dock" id="dock" aria-label="Funciones"></nav>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/app.js" type="module"></script>
</body>
</html>
